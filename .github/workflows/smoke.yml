name: smoke

# Fork-owned (aiand-code). Builds the real `aiand-code` binary and runs a tiny
# end-to-end workload — a prompt through the managed gateway (api.aiand.com)
# using the fork's free default model. Exercises the build, binary boot,
# model-catalog resolution, and an actual model call together. Requires the
# org key (OPENCODE_CONSOLE_TOKEN secret, fed as OPENCODE_API_KEY) — the gateway
# has no anonymous path; fork PRs without the secret skip the workload.
#
# Added file (FORK.md golden rule #1) — never conflicts with upstream sync.
# Gates PRs into dev and re-runs on push as a backstop.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # Only meaningful on the fork (the managed gateway + branding live here).
    if: github.repository == 'aiandlabs/aiand-code'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            os: linux
          - host: macos-14
            os: darwin
    runs-on: ${{ matrix.host }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      # --single  : build only this runner's native target (fast; one binary).
      # --skip-embed-web-ui : the `run` command is headless and never serves the
      #             web UI, so skip the (slow) app build. build.ts also runs its
      #             own `--version` smoke for the freshly built binary.
      - name: Build aiand-code binary
        run: ./packages/opencode/script/build.ts --single --skip-embed-web-ui
        env:
          OPENCODE_BUILD_OS: ${{ matrix.os }}

      - name: Locate the built binary
        id: bin
        shell: bash
        run: |
          set -euo pipefail
          path="$(find packages/opencode/dist -type f -name aiand-code | head -n1)"
          if [ -z "$path" ]; then
            echo "::error::aiand-code binary not found under packages/opencode/dist"
            find packages/opencode/dist -maxdepth 3 -type d || true
            exit 1
          fi
          echo "path=$PWD/$path" >> "$GITHUB_OUTPUT"
          echo "Built: $PWD/$path"

      - name: Boot check (--version)
        shell: bash
        run: |
          set -euo pipefail
          "${{ steps.bin.outputs.path }}" --version

      # Real workload: one prompt against the managed gateway, exercising the
      # fork's free default model (qwen/qwen3.6-27b) end-to-end.
      #
      # Auth: the gateway has NO anonymous/free path — every model needs a valid
      # org key. We feed the org `sk-` key (stored in the OPENCODE_CONSOLE_TOKEN
      # secret) as OPENCODE_API_KEY, which is the env var the `run`/defaultModel
      # path uses to enable the managed provider. (OPENCODE_CONSOLE_TOKEN alone
      # only enables the v2 catalog, not the v1 `run` path, without a real
      # `console login`.) PRs from forks get no secret, so there's nothing to
      # test against — skip cleanly rather than fail.
      #
      # cwd: run from a throwaway dir, NOT the repo checkout — the repo's
      # .opencode/opencode.jsonc sets "provider": {}, which makes defaultModel
      # raise NoProvidersError. A clean dir + throwaway HOME = a fresh first run.
      - name: Run a small workload (managed gateway)
        shell: bash
        env:
          HOME: ${{ runner.temp }}/aiand-home
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_CONSOLE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "No org key available (fork PR?) — the gateway has no anonymous path, skipping workload."
            exit 0
          fi
          work="${RUNNER_TEMP}/aiand-work"
          mkdir -p "$HOME" "$work"
          out="$(cd "$work" && "${{ steps.bin.outputs.path }}" run "Reply with the single word: pong" 2>&1)" || {
            echo "::error::aiand-code run exited non-zero"
            printf '%s\n' "$out"
            exit 1
          }
          printf '%s\n' "$out"
          if [ -z "${out// /}" ]; then
            echo "::error::aiand-code run produced no output"
            exit 1
          fi
