name: upstream-sync

# Keeps this fork in sync with the original repo (anomalyco/opencode).
#
# We track upstream's latest *published stable release* (the tagged `vX.Y.Z`
# commit), NOT the `dev` tip. `dev` carries dozens of unreleased, bleeding-edge
# commits between releases (~38/day); shipping those under a release label risks
# breakage. By merging only the release tag, our `dev` advances in stable hops
# and `auto-release` ships exactly what upstream blessed as a release.
#
# Hands-off path:   release merges cleanly   -> opens a PR + enables auto-merge
#                   -> existing test/typecheck CI gates it -> it lands itself.
# Manual path:      release conflicts         -> opens a PR with the conflict
#                   markers committed, labeled so you resolve it by hand.
#
# NOTE: PRs opened with the default GITHUB_TOKEN do NOT trigger other workflows
# (a GitHub Actions safety rule), so required CI checks won't run and auto-merge
# will wait forever. To get full hands-off auto-merge, create a fine-grained PAT
# with contents:write + pull_requests:write on this repo, store it as the repo
# secret SYNC_TOKEN, and this workflow will use it. Without it, the PR is still
# opened correctly for a one-click manual merge.

on:
  schedule:
    - cron: "0 6 * * *" # nightly at 06:00 UTC; no-ops unless upstream cut a new release
  workflow_dispatch: {} # also runnable on demand from the Actions tab

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/anomalyco/opencode.git
  UPSTREAM_REPO: anomalyco/opencode # for `gh api` release lookup
  TARGET_BRANCH: dev
  SYNC_BRANCH: chore/upstream-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch (full history)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "upstream-sync[bot]"
          git config user.email "upstream-sync@users.noreply.github.com"

      - name: Resolve upstream's latest stable release
        id: rel
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          # GitHub's /releases/latest returns the most recent non-draft,
          # non-prerelease release — i.e. upstream's current stable tag.
          tag=$(gh api "repos/$UPSTREAM_REPO/releases/latest" --jq '.tag_name')
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "Could not resolve upstream's latest release tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Upstream latest stable release: $tag"

      - name: Fetch upstream release tag
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch --no-tags upstream "refs/tags/${{ steps.rel.outputs.tag }}:refs/tags/${{ steps.rel.outputs.tag }}"

      - name: Check whether we are behind
        id: behind
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          behind=$(git rev-list --count "HEAD..$TAG")
          echo "count=$behind" >> "$GITHUB_OUTPUT"
          echo "Behind release $TAG by $behind commit(s)."

      - name: Attempt merge on sync branch
        if: steps.behind.outputs.count != '0'
        id: merge
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git checkout -B "$SYNC_BRANCH" "origin/$TARGET_BRANCH"
          if git merge --no-edit "$TAG"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            # Commit the conflicted tree (markers included) so the branch is
            # pushable and the PR clearly shows what needs resolving by hand.
            git add -A
            git commit --no-edit -m "chore: merge upstream release $TAG (CONFLICTS — needs manual resolution)"
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
          git push --force-with-lease origin "$SYNC_BRANCH"

      - name: Open / update pull request
        if: steps.behind.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.merge.outputs.status }}
          BEHIND: ${{ steps.behind.outputs.count }}
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          if [ "$STATUS" = "conflict" ]; then
            title="⚠️ Upstream release $TAG ($BEHIND commits) — CONFLICTS, manual resolution needed"
            body=$'Automated sync to upstream release `'"$TAG"'` hit merge conflicts.\n\nThis branch contains the merge with conflict markers committed. To resolve:\n```\ngit fetch origin '"$SYNC_BRANCH"'\ngit checkout '"$SYNC_BRANCH"'\n# fix conflict markers, then:\ngit add -A && git commit && git push\n```\nCI will validate once resolved.'
          else
            title="⬆️ Upstream release $TAG ($BEHIND commits)"
            body=$'Automated sync — merged upstream release `'"$TAG"'` cleanly.\n\nAuto-merge is enabled; this lands once required checks pass.'
          fi

          if gh pr view "$SYNC_BRANCH" --json number >/dev/null 2>&1; then
            gh pr edit "$SYNC_BRANCH" --title "$title" --body "$body"
          else
            gh pr create --base "$TARGET_BRANCH" --head "$SYNC_BRANCH" --title "$title" --body "$body"
          fi

          if [ "$STATUS" = "clean" ]; then
            gh pr merge "$SYNC_BRANCH" --auto --merge || echo "Auto-merge not enabled on repo or token lacks rights — merge manually."
          fi
